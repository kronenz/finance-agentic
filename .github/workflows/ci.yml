name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.9'
  NODE_VERSION: '18'

jobs:
  # 1. 코드 품질 검사
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Install Python dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 mypy pytest pytest-cov
    
    - name: Install Node.js dependencies
      run: |
        cd frontend
        npm install
    
    - name: Run Python linting
      run: |
        cd backend
        flake8 app/ tests/ --max-line-length=120 --exclude=venv,__pycache__
    
    - name: Run Python type checking
      run: |
        cd backend
        mypy app/ --ignore-missing-imports
    
    - name: Run Frontend linting
      run: |
        cd frontend
        npm run lint
    
    - name: Run Frontend type checking
      run: |
        cd frontend
        npm run type-check

  # 2. 백엔드 테스트
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov
    
    - name: Run database migrations
      run: |
        cd backend
        python -c "
        import asyncio
        from app.core.database import engine
        from app.models import Base
        
        async def migrate():
            async with engine.begin() as conn:
                await conn.run_sync(Base.metadata.create_all)
        
        asyncio.run(migrate())
        "
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379
    
    - name: Run unit tests
      run: |
        cd backend
        python -m pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=html
    
    - name: Run integration tests
      run: |
        cd backend
        python -m pytest tests/integration/ -v
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage

  # 3. 프론트엔드 테스트
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Install dependencies
      run: |
        cd frontend
        npm install
    
    - name: Run unit tests
      run: |
        cd frontend
        npm run test:unit
    
    - name: Run integration tests
      run: |
        cd frontend
        npm run test:integration
    
    - name: Build application
      run: |
        cd frontend
        npm run build

  # 4. E2E 테스트
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Install backend dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio aiohttp
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install
    
    - name: Start backend services
      run: |
        cd backend
        python -c "
        import asyncio
        from app.core.database import engine
        from app.models import Base
        
        async def migrate():
            async with engine.begin() as conn:
                await conn.run_sync(Base.metadata.create_all)
        
        asyncio.run(migrate())
        " &
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379
    
    - name: Start frontend services
      run: |
        cd frontend
        npm run build
        npm run preview -- --port 3000 &
        sleep 10
    
    - name: Run E2E tests
      run: |
        python tests/e2e/test_user_registration_and_trading.py
    
    - name: Run performance tests
      run: |
        python tests/performance/test_load_performance.py
    
    - name: Run security tests
      run: |
        python tests/security/test_security_vulnerabilities.py

  # 5. Docker 빌드 및 테스트
  docker-build:
    runs-on: ubuntu-latest
    needs: [code-quality, backend-tests, frontend-tests]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build backend Docker image
      run: |
        cd backend
        docker build -t finance-backend:test .
    
    - name: Build frontend Docker image
      run: |
        cd frontend
        docker build -t finance-frontend:test .
    
    - name: Test Docker images
      run: |
        docker run --rm finance-backend:test python -c "print('Backend image test passed')"
        docker run --rm finance-frontend:test node -e "console.log('Frontend image test passed')"

  # 6. 보안 스캔
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # 7. 배포 (main 브랜치만)
  deploy:
    runs-on: ubuntu-latest
    needs: [e2e-tests, docker-build, security-scan]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to production
      run: |
        echo "Deploying to production..."
        # 실제 배포 스크립트 실행
        # ./scripts/deploy_production.sh
    
    - name: Notify deployment
      run: |
        echo "Deployment completed successfully!"

  # 8. 테스트 결과 요약
  test-summary:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-tests]
    if: always()
    steps:
    - name: Test Summary
      run: |
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Backend Tests | ${{ needs.backend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Frontend Tests | ${{ needs.frontend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY