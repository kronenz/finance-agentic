# Phase 1 최소 기능 자동화 거래 시스템 설정

trading:
  exchange: "binance"
  symbol: "BTCUSDT"
  leverage: 5
  position_size_percent: 1.0
  max_daily_loss_percent: 2.0

strategies:
  supertrend:
    enabled: true
    atr_period: 10
    atr_multiplier: 3.0
  rsi_mean_reversion:
    enabled: true
    rsi_period: 14
    oversold_threshold: 30
    overbought_threshold: 70
    hold_days: 10

risk_management:
  max_consecutive_losses: 3
  maintenance_margin_buffer: 1.5
  emergency_stop_loss: true

api:
  binance:
    api_key: "test_api_key"
    secret_key: "test_secret_key"
    testnet: true

logging:
  level: "INFO"
  file: "logs/trading.log"
  max_size_mb: 100
  backup_count: 5