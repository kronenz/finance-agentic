groups:
  - name: finance-system-alerts
    rules:
      # 시스템 가용성 알림
      - alert: ServiceDown
        expr: up{job="finance-backend"} == 0
        for: 1m
        labels:
          severity: critical
          service: finance-backend
        annotations:
          summary: "Finance backend service is down"
          description: "Finance backend service has been down for more than 1 minute"
          runbook_url: "https://docs.example.com/runbooks/service-down"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) * 100 > 5
        for: 2m
        labels:
          severity: warning
          service: finance-backend
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }}% for the last 5 minutes"
          runbook_url: "https://docs.example.com/runbooks/high-error-rate"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels:
          severity: warning
          service: finance-backend
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }}s"
          runbook_url: "https://docs.example.com/runbooks/high-response-time"

      # 리소스 사용량 알림
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/high-cpu-usage"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}% on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/high-memory-usage"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
        for: 2m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Low disk space"
          description: "Disk space is {{ $value }}% available on {{ $labels.instance }}"
          runbook_url: "https://docs.example.com/runbooks/disk-space-low"

      # 데이터베이스 알림
      - alert: DatabaseDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: "PostgreSQL database is down"
          description: "PostgreSQL database has been down for more than 1 minute"
          runbook_url: "https://docs.example.com/runbooks/database-down"

      - alert: HighDatabaseConnections
        expr: pg_stat_database_numbackends / pg_settings_max_connections * 100 > 80
        for: 3m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "High database connection usage"
          description: "Database connection usage is {{ $value }}%"
          runbook_url: "https://docs.example.com/runbooks/high-db-connections"

      - alert: SlowDatabaseQueries
        expr: rate(pg_stat_database_tup_returned[5m]) / rate(pg_stat_database_tup_fetched[5m]) < 0.1
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "Slow database queries detected"
          description: "Database query efficiency is low"
          runbook_url: "https://docs.example.com/runbooks/slow-db-queries"

      # Redis 알림
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis is down"
          description: "Redis has been down for more than 1 minute"
          runbook_url: "https://docs.example.com/runbooks/redis-down"

      - alert: LowRedisHitRate
        expr: redis_keyspace_hits_total / (redis_keyspace_hits_total + redis_keyspace_misses_total) * 100 < 80
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Low Redis hit rate"
          description: "Redis hit rate is {{ $value }}%"
          runbook_url: "https://docs.example.com/runbooks/low-redis-hit-rate"

      - alert: HighRedisMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 90
        for: 3m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "High Redis memory usage"
          description: "Redis memory usage is {{ $value }}%"
          runbook_url: "https://docs.example.com/runbooks/high-redis-memory"

      # AI 에이전트 알림
      - alert: AIAgentDown
        expr: ai_agents_healthy < ai_agents_active
        for: 2m
        labels:
          severity: warning
          service: ai-agents
        annotations:
          summary: "AI agent is unhealthy"
          description: "One or more AI agents are not healthy"
          runbook_url: "https://docs.example.com/runbooks/ai-agent-down"

      - alert: HighAIAgentProcessingTime
        expr: histogram_quantile(0.95, rate(ai_agent_processing_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
          service: ai-agents
        annotations:
          summary: "High AI agent processing time"
          description: "AI agent processing time is {{ $value }}s"
          runbook_url: "https://docs.example.com/runbooks/high-ai-processing-time"

      # 비즈니스 메트릭 알림
      - alert: UnusualUserRegistration
        expr: rate(users_registered_total[1h]) > 100
        for: 5m
        labels:
          severity: warning
          service: business
        annotations:
          summary: "Unusual user registration rate"
          description: "User registration rate is {{ $value }} per hour"
          runbook_url: "https://docs.example.com/runbooks/unusual-registrations"

      - alert: HighSubscriptionCancellation
        expr: rate(subscriptions_cancelled_total[1h]) > 50
        for: 10m
        labels:
          severity: warning
          service: business
        annotations:
          summary: "High subscription cancellation rate"
          description: "Subscription cancellation rate is {{ $value }} per hour"
          runbook_url: "https://docs.example.com/runbooks/high-cancellations"

      - alert: UnusualTradingVolume
        expr: rate(trade_volume_total[1h]) > 1000000
        for: 5m
        labels:
          severity: warning
          service: business
        annotations:
          summary: "Unusual trading volume"
          description: "Trading volume is {{ $value }} per hour"
          runbook_url: "https://docs.example.com/runbooks/unusual-trading-volume"

      # 보안 알림
      - alert: HighFailedLogins
        expr: rate(auth_failed_logins_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "High failed login attempts"
          description: "Failed login rate is {{ $value }} per minute"
          runbook_url: "https://docs.example.com/runbooks/high-failed-logins"

      - alert: SuspiciousActivity
        expr: rate(http_requests_total{status="401"}[5m]) > 20
        for: 1m
        labels:
          severity: critical
          service: security
        annotations:
          summary: "Suspicious activity detected"
          description: "High rate of 401 responses: {{ $value }} per minute"
          runbook_url: "https://docs.example.com/runbooks/suspicious-activity"

  - name: finance-performance-alerts
    rules:
      # 성능 임계값 알림
      - alert: APIResponseTimeHigh
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: critical
          service: finance-backend
        annotations:
          summary: "API response time is very high"
          description: "99th percentile response time is {{ $value }}s"
          runbook_url: "https://docs.example.com/runbooks/api-response-time-high"

      - alert: DatabaseQueryTimeHigh
        expr: histogram_quantile(0.95, rate(db_query_duration_seconds_bucket[5m])) > 1
        for: 3m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "Database query time is high"
          description: "95th percentile query time is {{ $value }}s"
          runbook_url: "https://docs.example.com/runbooks/db-query-time-high"

      - alert: RedisOperationTimeHigh
        expr: histogram_quantile(0.95, rate(redis_operation_duration_seconds_bucket[5m])) > 0.1
        for: 3m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis operation time is high"
          description: "95th percentile operation time is {{ $value }}s"
          runbook_url: "https://docs.example.com/runbooks/redis-operation-time-high"
