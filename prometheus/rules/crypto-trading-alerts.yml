# Crypto Trading Subscription Service 알림 규칙

groups:
  - name: crypto-trading-service
    rules:
      # 서비스 다운 알림
      - alert: ServiceDown
        expr: up{job="crypto-trading-backend"} == 0
        for: 1m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "백엔드 서비스가 다운되었습니다"
          description: "백엔드 서비스가 1분 이상 응답하지 않습니다."

      # 높은 에러율 알림
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "높은 에러율이 감지되었습니다"
          description: "5xx 에러율이 10%를 초과했습니다."

      # 높은 응답 시간 알림
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "높은 응답 시간이 감지되었습니다"
          description: "95th percentile 응답 시간이 2초를 초과했습니다."

      # 데이터베이스 연결 실패 알림
      - alert: DatabaseDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "PostgreSQL 데이터베이스가 다운되었습니다"
          description: "PostgreSQL 데이터베이스에 연결할 수 없습니다."

      # Redis 연결 실패 알림
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis가 다운되었습니다"
          description: "Redis 서버에 연결할 수 없습니다."

      # 높은 메모리 사용량 알림
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job="crypto-trading-backend"} > 1000000000
        for: 5m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "높은 메모리 사용량이 감지되었습니다"
          description: "백엔드 서비스의 메모리 사용량이 1GB를 초과했습니다."

      # 디스크 공간 부족 알림
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "디스크 공간이 부족합니다"
          description: "디스크 사용 가능 공간이 10% 미만입니다."

      # CPU 사용률 높음 알림
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "높은 CPU 사용률이 감지되었습니다"
          description: "CPU 사용률이 80%를 초과했습니다."
